[package]
name = "usage_core"
version = "1.8.4"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
serde_json = "1"
leveldb-core = "0.1.2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
