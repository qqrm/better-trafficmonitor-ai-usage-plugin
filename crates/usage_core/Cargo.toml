[package]
name = "usage_core"
version = "1.7.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
leveldb-core = "0.1.2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
