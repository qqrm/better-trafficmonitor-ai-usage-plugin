name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Format check
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Release gate and artifact tampering controls
        shell: pwsh
        run: python scripts/test-release-workflow.py

      - name: Clippy (warnings denied)
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        shell: pwsh
        run: cargo test --locked --release --workspace --all-targets

      - name: Prove regression checks reject compiled faulty variants
        shell: pwsh
        run: cargo test --release --locked -p native_contract_tests --test negative_controls -- --ignored --nocapture

      - name: Save Windows negative-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: negative-control-evidence-windows
          path: target/negative-controls/*/evidence/*.log

      - name: Install cargo linters
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2
          fallback: none

      - name: cargo audit
        shell: pwsh
        run: cargo audit --deny warnings

      - name: cargo deny check
        shell: pwsh
        run: cargo deny --locked check

      - name: cargo machete
        shell: pwsh
        run: cargo machete

      - name: actionlint
        shell: pwsh
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9
        run: |
          $archive = Join-Path $env:RUNNER_TEMP actionlint.zip
          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v$env:ACTIONLINT_VERSION/actionlint_$env:ACTIONLINT_VERSION`_windows_amd64.zip" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ACTIONLINT_SHA256) { throw "actionlint checksum mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP actionlint-bin
          Expand-Archive $archive -DestinationPath $dest -Force
          & (Join-Path $dest actionlint.exe)

  portable-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.100.0
      - name: Rust logic and production C++ adapter contracts
        run: cargo test --locked --release --workspace --all-targets
      - name: Prove regression checks reject compiled faulty variants
        run: cargo test --release --locked -p native_contract_tests --test negative_controls -- --ignored --nocapture
      - name: Save portable negative-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: negative-control-evidence-portable
          path: target/negative-controls/*/evidence/*.log
