name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format check
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        shell: pwsh
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        shell: pwsh
        run: cargo test --release --all-targets

      - name: Install cargo linters
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete

      - name: cargo audit
        shell: pwsh
        run: cargo audit

      - name: cargo deny check
        shell: pwsh
        run: cargo deny check

      - name: cargo machete
        shell: pwsh
        run: cargo machete

      - name: Install actionlint
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: actionlint

      - name: actionlint
        shell: pwsh
        run: actionlint
