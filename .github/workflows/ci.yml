name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The plugin targets TrafficMonitor's v143/MFC toolchain. The moving
    # windows-latest image now uses Visual Studio 2026 without x64 MFC.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - name: Build and package
        shell: pwsh
        run: ./scripts/build-release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BetterTrafficMonitorAiUsage-x64
          path: |
            dist/*.zip
            dist/*.sha256
