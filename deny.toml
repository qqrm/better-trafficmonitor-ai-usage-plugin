# Inspect the complete locked graph, including Windows and build dependencies.
[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
# Explicit SPDX policy; no crate-specific license/advisory exceptions.
allow = ["Apache-2.0", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
